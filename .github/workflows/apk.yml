name: APK

# Produit un APK installable à chaque push sur main, et l'attache à une
# release quand on pose un tag `v*`. Aucun secret n'est nécessaire pour
# obtenir un APK : la distribution Firebase, elle, est optionnelle.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Construire l'APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Vérifier le contenu avant de construire
        working-directory: tools
        run: |
          npm ci
          node validate-content.mjs
          node emit-difficulty-fixture.mjs es --check
          node emit-difficulty-fixture.mjs en --check

      - name: Moteur
        working-directory: packages/kameo_engine
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Application
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Générer le dossier android si absent
        # `flutter create` n'écrase pas lib/ : il ne fait qu'ajouter ce qui
        # manque. Le dossier android/ peut donc être versionné ou pas — la CI
        # fonctionne dans les deux cas.
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org ch.kameo --project-name kameo .
          fi

      - name: Construire l'APK
        # Sans keystore, Flutter signe avec la clé de debug : l'APK
        # s'installe en autorisant les « sources inconnues », mais ne peut
        # pas être publié sur le Play Store en l'état.
        run: flutter build apk --release

      - name: Préparer les fichiers à publier
        run: |
          mkdir -p dist
          # Un nom stable pour le lien permanent, et un nom daté pour l'historique.
          cp build/app/outputs/flutter-apk/app-release.apk dist/kameo.apk
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/kameo-build-${GITHUB_RUN_NUMBER}.apk"
          ls -lh dist/

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: kameo-apk
          path: dist/*.apk
          retention-days: 30

      # Un lien permanent, téléchargeable depuis un téléphone sans compte :
      #   https://github.com/ddmathys/langage/releases/download/latest/kameo.apk
      # La release `latest` est réécrite à chaque build de main.
      - name: Publier le dernier APK (lien permanent)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernier APK
          body: |
            APK de développement, reconstruit à chaque push sur `main`.

            **Lien permanent** — il pointe toujours vers la dernière version :
            https://github.com/ddmathys/langage/releases/download/latest/kameo.apk

            Construit depuis `${{ github.sha }}`.

            Signé avec la clé de debug : Android demandera d'autoriser
            l'installation depuis une source inconnue. Ne peut pas être publié
            sur le Play Store en l'état.
          files: dist/*.apk
          make_latest: true

      - name: Attacher l'APK à la release de version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

      # Distribution aux testeurs. S'active toute seule le jour où les deux
      # secrets existent — sans eux, l'étape est simplement sautée.
      - name: Distribuer aux testeurs (Firebase App Distribution)
        if: ${{ vars.FIREBASE_APP_ID != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ vars.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testeurs
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: |
            ${{ github.event.head_commit.message }}
