name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  moteur:
    name: Moteur (Dart pur)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kameo_engine
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  app:
    name: Application Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
