name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  moteur:
    name: Moteur (Dart pur)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kameo_engine
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  contenu:
    name: Contenu (schéma, règles pédagogiques, parité)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Valider le contenu
        run: node validate-content.mjs
      - name: Vérifier la parité de la formule de difficulté
        run: |
          node emit-difficulty-fixture.mjs es --check
          node emit-difficulty-fixture.mjs en --check

  app:
    name: Application Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
