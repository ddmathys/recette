<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Corps : dégradé radial décalé en haut à gauche pour l'effet 3D -->
    <radialGradient id="body" cx="36%" cy="34%" r="72%">
      <stop offset="0" stop-color="#ff8a6b"/>
      <stop offset="0.35" stop-color="#f23d2b"/>
      <stop offset="0.8" stop-color="#b8141c"/>
      <stop offset="1" stop-color="#7d0a12"/>
    </radialGradient>
    <radialGradient id="flesh" cx="30%" cy="50%" r="80%">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset="0.7" stop-color="#fbeec2"/>
      <stop offset="1" stop-color="#eed592"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe36a"/>
      <stop offset="0.6" stop-color="#3fae3a"/>
      <stop offset="1" stop-color="#1f7a2a"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a33"/>
      <stop offset="1" stop-color="#4f3019"/>
    </linearGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <path id="apple" d="M256 150 C 222 118 128 108 98 196 C 70 282 116 418 188 442 C 220 452 240 436 256 436 C 272 436 292 452 324 442 C 396 418 442 282 414 196 C 384 108 290 118 256 150 Z"/>
    <clipPath id="appleClip"><use href="#apple"/></clipPath>
    <!-- Croquée à droite : trois cercles qui se chevauchent = marque de dents -->
    <mask id="bite">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="436" cy="226" r="42" fill="#000"/>
      <circle cx="452" cy="286" r="48" fill="#000"/>
      <circle cx="436" cy="346" r="40" fill="#000"/>
    </mask>
  </defs>

  <ellipse cx="256" cy="462" rx="150" ry="22" fill="url(#shadow)"/>

  <g mask="url(#bite)">
    <use href="#apple" fill="url(#body)"/>
    <!-- Chair visible autour de la morsure -->
    <g clip-path="url(#appleClip)">
      <circle cx="436" cy="226" r="62" fill="url(#flesh)"/>
      <circle cx="452" cy="286" r="68" fill="url(#flesh)"/>
      <circle cx="436" cy="346" r="60" fill="url(#flesh)"/>
    </g>
    <!-- Reflet principal + ombre douce en bas à droite -->
    <ellipse cx="170" cy="215" rx="48" ry="70" transform="rotate(-24 170 215)" fill="url(#shine)"/>
    <ellipse cx="150" cy="186" rx="14" ry="22" transform="rotate(-24 150 186)" fill="#fff" fill-opacity="0.7"/>
  </g>

  <!-- Pépins dans la chair -->
  <ellipse cx="392" cy="270" rx="6.5" ry="12" transform="rotate(-12 392 270)" fill="#5a3418"/>
  <ellipse cx="394" cy="304" rx="6" ry="11" transform="rotate(12 394 304)" fill="#5a3418"/>

  <path d="M252 160 C 250 128 256 100 272 76" stroke="url(#stem)" stroke-width="15" stroke-linecap="round" fill="none"/>
  <path d="M270 112 C 300 66 368 62 392 82 C 366 128 306 138 270 112 Z" fill="url(#leaf)"/>
  <path d="M276 110 C 312 96 346 88 382 84" stroke="#e9ffd9" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>
