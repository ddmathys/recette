name: kameo
description: Kameo — apprendre une langue en voyageant.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.0
  kameo_engine:
    path: packages/kameo_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Le contenu n'est jamais en dur dans le code Dart (doc 04 §6).
    # Même format en local qu'en Firestore : seule la source change.
    - content/cefr-descriptors.json
    - content/es/lexicon-seed.json
    - content/es/countries/espana.json
    - content/es/packs/2026-08-22_v1/
    - content/en/lexicon-seed.json
    - content/en/countries/uk.json
    - content/en/countries/usa.json
  fonts:
    # Polices variables : un seul fichier par famille couvre toutes les
    # graisses, pilotées par FontVariation('wght', …) dans le thème.
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
