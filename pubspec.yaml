name: kameo
description: Kameo — apprendre une langue en voyageant.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  kameo_engine:
    path: packages/kameo_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Le contenu n'est jamais en dur dans le code Dart (doc 04 §6).
    # Même format en local qu'en Firestore : seule la source change.
    - content/es/lexicon-seed.json
